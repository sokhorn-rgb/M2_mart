<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KH POS — បន្ថែមផលិតផលថ្មី</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent: #3b82f6;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --success: #10b981;
        }

        * { box-sizing: border-box; transition: all 0.2s ease; }
        
        body { 
            font-family: 'Plus Jakarta Sans', 'Kantumruy Pro', sans-serif; 
            background: radial-gradient(circle at top left, #1e293b, #0f172a);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding-bottom: 120px;
        }

        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }

        .header { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; }
        h1 { font-size: 1.8rem; font-weight: 800; margin: 0; letter-spacing: -0.5px; }
        
        .btn-back {
            text-decoration: none; color: var(--text-sub); background: rgba(255,255,255,0.05);
            padding: 10px 18px; border: 1px solid var(--border); border-radius: 12px;
            font-size: 0.9rem; font-weight: 700;
        }
        .btn-back:hover { background: rgba(255,255,255,0.1); color: #fff; }

        /* --- GLASS FORM --- */
        .form-card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        .full-width { grid-column: span 2; }

        .form-group { display: flex; flex-direction: column; gap: 10px; }
        label { font-size: 0.85rem; font-weight: 700; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.5px; }
        
        input, select, textarea {
            padding: 14px 18px;
            border: 1px solid var(--border);
            border-radius: 14px;
            font-size: 1rem;
            font-family: inherit;
            color: #fff;
            background: rgba(15, 23, 42, 0.5);
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(15, 23, 42, 0.8);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        /* File Upload */
        .file-dropzone {
            border: 2px dashed var(--border);
            border-radius: 14px;
            padding: 30px;
            text-align: center;
            background: rgba(255, 255, 255, 0.02);
            cursor: pointer;
        }
        .file-dropzone:hover { border-color: var(--accent); background: rgba(59, 130, 246, 0.05); }
        .file-dropzone input { display: none; }

        .form-actions {
            margin-top: 35px;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            padding-top: 25px;
            border-top: 1px solid var(--border);
        }

        .btn-submit {
            background: var(--accent); color: white; border: none;
            padding: 14px 30px; border-radius: 14px;
            font-size: 1rem; font-weight: 800; cursor: pointer;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3); }

        .btn-cancel {
            background: transparent; color: var(--text-sub); border: 1px solid var(--border);
            padding: 14px 25px; border-radius: 14px;
            font-weight: 700; cursor: pointer;
        }

        /* Navigation Dock */
        .dock-nav {
            position: fixed;
            bottom: 25px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            padding: 8px 16px; border-radius: 20px;
            display: flex; align-items: center; gap: 10px;
            border: 1px solid var(--border);
            z-index: 1000;
        }
        .dock-btn {
            text-decoration: none; color: var(--text-sub);
            padding: 10px 15px; border-radius: 15px;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            font-size: 0.7rem; font-weight: 700;
        }
        .dock-btn.active { color: #fff; background: rgba(255, 255, 255, 0.1); }

        /* --- MODERN NAVIGATION DOCK --- */
.dock-nav {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(15, 23, 42, 0.85); /* Deep Navy ថ្លា */
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    padding: 10px 20px;
    border-radius: 24px;
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 
                inset 0 1px 1px rgba(255, 255, 255, 0.1);
    z-index: 1000;
}

.dock-btn {
    text-decoration: none;
    color: var(--text-sub);
    padding: 10px 18px;
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    font-size: 0.75rem;
    font-weight: 700;
    min-width: 65px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Hover Effect */
.dock-btn:hover {
    color: #fff;
    background: rgba(255, 255, 255, 0.05);
    transform: translateY(-5px);
}

/* Active State */
.dock-btn.active {
    color: #fff;
    background: linear-gradient(145deg, rgba(59, 130, 246, 0.2), rgba(59, 130, 246, 0.1));
    box-shadow: 0 4px 15px rgba(59, 130, 246, 0.2);
}

.dock-btn i {
    font-size: 1.3rem;
    font-style: normal;
    margin-bottom: 2px;
}

/* Divider Line */
.dock-divider {
    width: 1px;
    height: 30px;
    background: linear-gradient(to bottom, transparent, var(--border), transparent);
    margin: 0 10px;
}

/* Logout Styling */
.logout-form { margin: 0; }
.logout-btn {
    background: rgba(244, 63, 94, 0.1);
    border: 1px solid rgba(244, 63, 94, 0.2);
    padding: 12px;
    border-radius: 18px;
    cursor: pointer;
    color: var(--danger);
    font-size: 1.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
}

.logout-btn:hover {
    background: var(--danger);
    color: white;
    transform: scale(1.1) rotate(5deg);
    box-shadow: 0 5px 15px rgba(244, 63, 94, 0.4);
}

/* Mobile Responsiveness */
@media (max-width: 500px) {
    .dock-nav {
        width: 95%;
        padding: 8px;
        gap: 2px;
    }
    .dock-btn {
        padding: 8px;
        min-width: 55px;
    }
}
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <a href="/sales/products/" class="btn-back">← Back</a>
        <h1>បន្ថែមផលិតផលថ្មី</h1>
    </div>

    <form method="post" enctype="multipart/form-data" class="form-card">
        {% csrf_token %}
        <div class="form-grid">
            <div class="form-group full-width">
                <label>ឈ្មោះផលិតផល (Product Name)</label>
                <input type="text" name="name" required placeholder="ឧទាហរណ៍៖ Coca Cola">
            </div>

            <div class="form-group">
                <label>ប្រភេទ (Category)</label>
                <select name="category" required>
                    <option value="" disabled selected>ជ្រើសរើសប្រភេទ...</option>
                    <option value="Food & Snacks">អាហារ និងនំចំណី (Food & Snacks)</option>
                    <option value="Beverages">ភេសជ្ជៈ (Beverages)</option>
                    <option value="Electronics">គ្រឿងអេឡិចត្រូនិច (Electronics)</option>
                    <option value="General">ផ្សេងៗ (General)</option>
                </select>
            </div>

            <div class="form-group">
                <label>តម្លៃលក់ ($ Price)</label>
                <input type="number" name="price" step="0.01" required placeholder="0.00">
            </div>

            <div class="form-group full-width">
                <label>ចំនួនក្នុងស្តុក (Stock)</label>
                <input type="number" name="stock" required placeholder="0">
            </div>

            <div class="form-group full-width">
                <label>រូបភាពផលិតផល</label>
                <label class="file-dropzone">
                    <p>📸 ចុចទីនេះដើម្បី <strong>បញ្ចូលរូបភាព</strong></p>
                    <input type="file" name="image" accept="image/*">
                </label>
            </div>
        </div>

        <div class="form-actions">
            <button type="button" onclick="history.back()" class="btn-cancel">Cancel</button>
            <button type="submit" class="btn-submit">Save Product</button>
        </div>
    </form>
</div>

<nav class="dock-nav">
    <a href="/sales/orders/new/" class="dock-btn"><i>🛒</i><span>លក់</span></a>
    <a href="/sales/products/" class="dock-btn active"><i>📦</i><span>ទំនិញ</span></a>
    <a href="/sales/orders/" class="dock-btn"><i>📊</i><span>ប្រវត្តិ</span></a>
</nav>

</body>
</html>
